events {
    worker_connections 1024;
}

http {
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Rate Limiting Zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # HTTP To HTTPS Redirection (Port 80)
    server {
        listen 80;
        server_name bdagro.duckdns.org;

        return 301 https://$host$request_uri;
    }

    # Main Http Server Block (Port 443)
    server {
        listen 443 ssl http2;
        server_name bdagro.duckdns.org;


        # SSL certificates (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/bdagro.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bdagro.duckdns.org/privkey.pem;

        # SSL Optimization
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Security Headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Frontend (Client)
        location / {
            proxy_pass http://client:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # WebSocket / Socket.io
        location /socket.io/ {
            proxy_pass http://server:5000;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;


            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Backend API (Express.js)
        location /api/ {

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://server:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
