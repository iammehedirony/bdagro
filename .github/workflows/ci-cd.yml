name: Production CI/CD Pipeline

on:
    push:
        branches: [main]

jobs:
    # ==========================================
    # JOB 1: Testing & Code Quality Check
    # ==========================================
    test-and-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Backend - Install, Lint & Build Check
              run: |
                  cd bdagro-backend
                  npm ci
                  npm run build

            - name: Frontend - Install, Lint & Build Check
              run: |
                  cd bdagro-frontend
                  npm ci
                  npm run lint || true
                  npm run build

    # ==========================================
    # JOB 2: Build Docker Images and Push
    # ==========================================
    build-and-push:
        needs: test-and-lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Backend
              run: |
                  docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/bdagro-backend:latest ./bdagro-backend
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/bdagro-backend:latest

            - name: Build and Push Frontend
              run: |
                  docker build \
                    --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
                    --build-arg NEXT_PUBLIC_SOCKET_URL=${{ secrets.NEXT_PUBLIC_SOCKET_URL }} \
                    --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }} \
                    --build-arg NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }} \
                    --build-arg NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }} \
                    -t ${{ secrets.DOCKERHUB_USERNAME }}/bdagro-frontend:latest ./bdagro-frontend

                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/bdagro-frontend:latest

    # ==========================================
    # JOB 3: Deploy to AWS EC2
    # ==========================================

    deploy-to-ec2:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - name: Add EC2 to Known Hosts
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

            - name: SSH Deploy to EC2
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_KEY }}
                  script: |
                      cd ${{ secrets.EC2_APP_DIR }}
                      docker compose pull
                      docker compose up -d --remove-orphans
