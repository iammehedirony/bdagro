services:
  redis:
    image: redis:alpine
    container_name: bdagro_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - bdagro_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    image: iammehedirony/bdagro-backend:latest
    container_name: bdagro_server
    restart: unless-stopped
    env_file:
      - ./bdagro-backend/.env
    environment:
        - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
        healthcheck:
          test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); })"]
          interval: 30s
          timeout: 10s
          retries: 3
    networks:
      - bdagro_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  client:
    image: iammehedirony/bdagro-frontend:latest
    environment:
          - HOSTNAME=0.0.0.0
          - PORT=3000
    container_name: bdagro_client
    restart: unless-stopped
    env_file:
      - ./bdagro-frontend/.env
    depends_on:
      server:
        condition: service_healthy
    networks:
      - bdagro_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"

  nginx:
    image: nginx:alpine
    container_name: bdagro_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - client
      - server
    networks:
      - bdagro_network

networks:
  bdagro_network:
    driver: bridge

volumes:
  redis_data:
